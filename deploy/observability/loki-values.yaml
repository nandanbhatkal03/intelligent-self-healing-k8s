# Loki in single-binary (monolithic) mode with filesystem storage —
# right-sized for a single-developer Kind cluster. FR-1.2, FR-1.6.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h           # 7 days, FR-1.6
    allow_structured_metadata: true  # required for native OTLP ingestion
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1Gi }

# Scalable-mode components off
read:    { replicas: 0 }
write:   { replicas: 0 }
backend: { replicas: 0 }

gateway:      { enabled: false }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
minio:        { enabled: false }
