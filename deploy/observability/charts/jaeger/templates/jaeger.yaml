# Jaeger v2 all-in-one (in-memory storage). Receives OTLP from the
# OpenTelemetry Collector and serves the UI/query API on 16686. FR-1.3.
# In-memory is fine for the testbed: traces are used for root-cause
# context, while long-term evidence lives in Prometheus/Loki.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jaeger }
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.image }}
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui,        containerPort: 16686 }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels: { app.kubernetes.io/name: jaeger }
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317,  targetPort: 4317 }
    - { name: otlp-http, port: 4318,  targetPort: 4318 }
    - { name: ui,        port: 16686, targetPort: 16686 }
