# ShopLite application tier. Generated once, then edited by hand is fine.
# Each Deployment keeps revisionHistoryLimit 5 so the remediation
# controller can roll back a bad release (FR-4.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: shoplite
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: shoplite
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: shoplite:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: SERVICE_ROLE, value: frontend }
            - { name: APP_VERSION, value: "0.1.0" }
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: INVENTORY_URL, value: "http://inventory:8000" }
            - { name: ORDERS_URL, value: "http://orders:8000" }
            - { name: FAULT_ADMIN_ENABLED, value: "true" }
            # >0 simulates a bad release; fixed only by rolling back
            - { name: BUGGY_RELEASE_ERROR_RATE, value: "0" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc:4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)" }
          # Kubernetes-native self-healing = the baseline we compare against (FR-6.3)
          # Allow up to 2 min for first start on a busy laptop before liveness applies
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 4
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits:   { cpu: 500m, memory: 256Mi }   # memory-leak fault ends in OOMKill
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: shoplite
    selfheal/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - { name: http, port: 8000, targetPort: http }
---
