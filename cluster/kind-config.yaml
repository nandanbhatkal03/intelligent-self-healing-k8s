# Local evaluation cluster: 1 control-plane + 2 workers.
# Two workers let Chaos Mesh kill/stress pods on one node while the
# other keeps serving, so we can observe partial degradation, not just
# total outage.  SRS §2.4 (min 4 cores / 8 GB RAM on the host).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: selfheal
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
    labels:
      selfheal/role: workload
  - role: worker
    labels:
      selfheal/role: workload
